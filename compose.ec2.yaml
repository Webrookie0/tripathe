# Public HTTP entry point for the EC2 demo. The base stack keeps API, Redis,
# Temporal gRPC and the Temporal UI bound to loopback on the host.
services:
  proxy:
    image: nginx:1.28.0-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1/live"]
      interval: 5s
      timeout: 3s
      retries: 10
