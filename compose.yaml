name: hotel-offers

x-application: &application
  image: hotel-offer-orchestrator:local
  build: .
  init: true
  restart: unless-stopped
  stop_grace_period: 60s
  env_file:
    - path: .env.hotel
      required: false
  environment:
    HOTEL_PORT: "3000"
    TEMPORAL_ADDRESS: temporal:7233
    REDIS_URL: redis://redis:6379
    SUPPLIER_BASE_URL: http://api:3000

services:
  redis:
    image: redis:7.4.2-alpine
    command: ["redis-server", "--appendonly", "yes"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  temporal:
    image: temporalio/temporal:1.10.1
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--ui-ip", "0.0.0.0", "--db-filename", "/home/temporal/temporal.db"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:7233:7233"
      - "127.0.0.1:8233:8233"
    volumes:
      - temporal-data:/home/temporal
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "127.0.0.1:7233"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  api:
    <<: *application
    command: ["node", "dist/api/server.js"]
    ports:
      - "${HOTEL_API_BIND:-127.0.0.1}:${HOTEL_API_PORT:-3000}:3000"
    depends_on:
      redis:
        condition: service_healthy
      temporal:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/live',{signal:AbortSignal.timeout(2000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10

  worker:
    <<: *application
    command: ["node", "dist/temporal/worker.js"]
    depends_on:
      redis:
        condition: service_healthy
      temporal:
        condition: service_healthy
      api:
        condition: service_healthy

volumes:
  redis-data:
  temporal-data:
